<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Gestión Camión — Mi Gusto</title>
<!--
  NOTA PARA EL EQUIPO DE SISTEMAS:
  Este archivo es un prototipo funcional hecho en Claude (Anthropic) para validar
  el flujo, las pantallas y los campos de "Gestión Camión", la bitácora digital del chofer
  de Mi Gusto.
  El guardado de datos usa "window.storage", una función exclusiva del entorno
  de Claude que NO funciona fuera de esta plataforma. Para llevarlo a producción,
  reemplazar todas las llamadas a window.storage.get / .set / .list por llamadas
  a su propia base de datos / API (misma estructura de datos: ver los objetos
  "entry" que arma cada formulario, más abajo en el bloque de código JavaScript).

  ESTILO VISUAL: esta pantalla sigue el sistema de diseño compartido de Mi Gusto
  (mi-gusto-design-system.css / mi-gusto-style-guide.html): fondo oscuro, tarjetas
  redondeadas, botones tipo píldora, verde como color de acción principal. Las
  variables de color (--bg, --panel, --green, etc.) son las mismas que usan las
  demás herramientas internas, para que todas se vean parte de un mismo sistema.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (opcional): solo se usa si la app corre fuera de Claude Y el usuario
     configuró sus propias credenciales desde la pantalla de Configuración de la app.
     Si no se configura nada, estos scripts quedan sin uso. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<!-- SheetJS: para generar el informe como un Excel (.xlsx) real, con hojas y columnas. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* Tokens del sistema de diseño Mi Gusto */
    --bg:#0a0a0a;
    --panel:#151515;
    --panel-2:#1c1c1c;
    --border:#272727;
    --border-soft:#202020;
    --text:#f2f2f2;
    --text-dim:#9a9a9a;
    --text-faint:#5c5c5c;
    --green:#22c55e;
    --green-dark:#16a34a;
    --green-soft:rgba(34,197,94,0.12);
    --red:#ef4444;
    --red-soft:rgba(239,68,68,0.12);
    --blue:#38bdf8;
    --purple:#a78bfa;
    --amber:#f5a623;
    --radius-lg:14px;
    --radius-md:10px;
    --radius-sm:7px;

    /* Acento propio de esta herramienta: naranja, para la urgencia "alta"
       (no pisa ningún color del sistema compartido, se suma como variable nueva) */
    --orange:#fb923c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px;}

  /* ---- Header (equivalente a mg-header) ---- */
  .topbar{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);margin:14px 14px 0;padding:16px 18px;position:relative;overflow:hidden;}
  .topbar .eyebrow{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:5px;}
  .topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.2px;color:var(--text);}
  .topbar p{margin:5px 0 0;font-size:12.5px;color:var(--text-dim);}

  /* ---- Tabs de navegación (mg-tabs) ---- */
  .nav{display:flex;gap:8px;padding:14px 14px 0;background:var(--bg);flex-wrap:wrap;}
  .nav button{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text-dim);padding:9px 12px;border-radius:999px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s;}
  .nav button.active{background:var(--green);color:#06210f;border-color:var(--green);}

  .content{padding:16px 14px 10px;}

  /* ---- Acciones grandes de inicio (tarjetas tipo mg-card) ---- */
  .home-grid{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .big-btn{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:var(--radius-lg);padding:16px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:filter 0.15s;}
  .big-btn:hover{filter:brightness(1.08);}
  .big-btn.urgent{border-left-color:var(--red);}
  .big-btn.warn{border-left-color:var(--amber);}
  .big-btn .icon{width:42px;height:42px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--panel-2);flex-shrink:0;}
  .big-btn.urgent .icon{background:var(--red-soft);}
  .big-btn.warn .icon{background:rgba(245,166,35,0.12);}
  .big-btn .txt strong{display:block;font-size:15px;color:var(--text);font-weight:700;}
  .big-btn .txt span{display:block;font-size:12.5px;color:var(--text-dim);margin-top:2px;}

  /* ---- Estadísticas ---- */
  .summary-row{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 16px;}
  .stat{flex:1 1 calc(50% - 5px);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 10px;text-align:center;}
  .stat .n{font-size:21px;font-weight:800;color:var(--text);}
  .stat.alert .n{color:var(--red);}
  .stat .l{font-size:10.5px;color:var(--text-dim);margin-top:2px;}

  /* ---- Formularios (mg-input / mg-select) ---- */
  label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;margin:16px 0 6px;}
  label:first-of-type{margin-top:4px;}
  input[type=text], input[type=number], input[type=tel], input[type=date], input[type=datetime-local], select, textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:11px 12px;border-radius:var(--radius-sm);font-size:14.5px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  input::placeholder, textarea::placeholder{color:var(--text-faint);}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--blue);}
  .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}

  /* ---- Chips seleccionables (pill, como mg-tab) ---- */
  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-opt{flex:1;min-width:90px;border:1px solid var(--border);border-radius:999px;padding:10px 10px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-dim);background:var(--panel);transition:all 0.15s;}
  .radio-opt.selected{border-color:var(--blue);background:rgba(56,189,248,0.14);color:var(--blue);}
  .radio-opt.selected.bad{border-color:var(--red);background:var(--red-soft);color:var(--red);}

  .urgency-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .urg-opt{flex:1;min-width:70px;border:1px solid var(--border);border-radius:999px;padding:9px 6px;text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--panel);color:var(--text-dim);transition:all 0.15s;}
  .urg-opt[data-u="baja"].selected{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .urg-opt[data-u="media"].selected{background:rgba(245,166,35,0.14);border-color:var(--amber);color:var(--amber);}
  .urg-opt[data-u="alta"].selected{background:rgba(251,146,60,0.14);border-color:var(--orange);color:var(--orange);}
  .urg-opt[data-u="critica"].selected{background:var(--red-soft);border-color:var(--red);color:var(--red);}

  .check-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--panel);border-radius:var(--radius-sm);padding:12px;margin-top:16px;cursor:pointer;}
  .check-row input{width:18px;height:18px;flex-shrink:0;accent-color:var(--green);}
  .check-row span{font-size:13.5px;font-weight:600;color:var(--text);}

  /* ---- Selector de fotos / archivos (patrón label.btn + input file oculto) ---- */
  .photo-picker{margin-top:16px;}
  .photo-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--blue);border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;color:var(--blue);background:transparent;cursor:pointer;}
  .photo-btn input{display:none;}
  .photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .photo-thumb{position:relative;width:64px;height:64px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.7);color:#fff;border:none;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;}

  /* ---- Botones (btn / btn-primary) ---- */
  .submit-btn{width:100%;background:var(--green);color:#06210f;border:none;padding:14px;border-radius:999px;font-size:15px;font-weight:800;margin-top:22px;cursor:pointer;letter-spacing:0.1px;transition:filter 0.15s;}
  .submit-btn:hover{filter:brightness(1.12);}
  .submit-btn:disabled{background:var(--border);color:var(--text-faint);cursor:not-allowed;filter:none;}
  .submit-btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .submit-btn.small{padding:10px;font-size:13.5px;margin-top:12px;}

  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12.5px;font-weight:700;background:none;border:none;cursor:pointer;padding:0 0 8px;}

  .section-title{font-size:16px;font-weight:800;color:var(--text);margin:2px 0 14px;}

  /* ---- Filtros ---- */
  .filter-bar{display:flex;gap:8px;margin-bottom:14px;}
  .filter-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .filter-pill{flex:none !important;padding:8px 14px;font-size:12px;}
  .filter-bar select{flex:1;}

  /* ---- Tarjetas de registro (entry) ---- */
  .entry{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;border-left:4px solid var(--blue);}
  .entry.u-critica{border-left-color:var(--red);}
  .entry.u-alta{border-left-color:var(--orange);}
  .entry.u-media{border-left-color:var(--amber);}
  .entry.u-baja{border-left-color:var(--green);}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .entry-top-right{display:flex;align-items:center;gap:8px;}
  .del-btn{background:transparent;border:none;color:var(--text-faint);font-size:13px;cursor:pointer;padding:2px 4px;border-radius:6px;line-height:1;}
  .del-btn:hover{color:var(--red);}
  .del-confirm{background:var(--red-soft);border:1px solid var(--red);border-radius:var(--radius-md);padding:12px;margin-top:10px;}
  .del-confirm p{font-size:12.5px;color:var(--text);margin:0 0 10px;}
  .del-confirm-actions{display:flex;gap:8px;}
  .del-confirm-actions button{flex:1;padding:8px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
  .del-yes{background:var(--red);color:#2a0a0a;}
  .del-no{background:transparent;border:1px solid var(--border) !important;color:var(--text-dim);}
  .entry-top .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--text-dim);}
  .entry-top .date{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .entry h4{margin:8px 0 2px;font-size:14.5px;color:var(--text);}
  .entry p{margin:2px 0;font-size:13px;color:var(--text-dim);line-height:1.5;}

  /* ---- Chips / badges (mg-chip) ---- */
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .badge.baja{background:var(--green-soft);color:var(--green);}
  .badge.media{background:rgba(245,166,35,0.14);color:var(--amber);}
  .badge.alta{background:rgba(251,146,60,0.14);color:var(--orange);}
  .badge.critica{background:var(--red-soft);color:var(--red);}
  .badge.abierta{background:var(--red-soft);color:var(--red);}
  .badge.asignada{background:rgba(245,166,35,0.14);color:var(--amber);}
  .badge.resuelta{background:var(--green-soft);color:var(--green);}
  .entry-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .entry-photos img{width:64px;height:64px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;}

  .manage-btn{margin-top:10px;background:transparent;border:1px solid var(--blue);color:var(--blue);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;}
  .manage-btn.obs-btn{border-color:var(--border);color:var(--text-dim);}
  .entry-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .manage-panel{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .manage-panel label{margin:10px 0 5px;font-size:11px;}
  .manage-panel .submit-btn{padding:11px;font-size:13.5px;margin-top:14px;}

  /* ---- Historial de actualizaciones (timeline de seguimiento) ---- */
  .timeline{margin-top:14px;}
  .timeline-title{font-size:11px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;}
  .timeline-item{position:relative;padding-left:20px;padding-bottom:14px;border-left:2px solid var(--border);margin-left:5px;}
  .timeline-item:last-child{border-left-color:transparent;padding-bottom:0;}
  .timeline-item::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--panel);}
  .timeline-item.tl-resuelta::before{background:var(--green);}
  .timeline-item.tl-abierta::before{background:var(--red);}
  .timeline-item .tl-date{font-size:10.5px;color:var(--text-faint);font-weight:700;margin-bottom:2px;}
  .timeline-item .tl-text{font-size:13px;color:var(--text);line-height:1.5;}

  /* ---- Mensaje de WhatsApp sugerido ---- */
  .wa-box{background:var(--green-soft);border:1px solid rgba(34,197,94,0.35);border-radius:var(--radius-md);padding:12px;margin-top:14px;}
  .wa-box p{font-size:13px;color:var(--text);margin:0 0 10px;white-space:pre-wrap;}
  .wa-actions{display:flex;gap:8px;}
  .wa-actions button, .wa-actions a{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:700;padding:9px;border-radius:999px;cursor:pointer;border:none;font-family:inherit;}
  .wa-copy{background:transparent;color:var(--green);border:1px solid var(--green) !important;}
  .wa-open{background:#25D366;color:#06210f;}

  .empty{text-align:center;color:var(--text-dim);font-size:13.5px;padding:36px 20px;}

  /* ---- Toast ---- */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.5);opacity:0;transition:opacity 0.25s ease, transform 0.25s ease;pointer-events:none;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .disclosure{font-size:11px;color:var(--text-faint);text-align:center;padding:14px 20px 0;line-height:1.5;}
  .loading{text-align:center;padding:30px;color:var(--text-dim);font-size:13.5px;}

  /* ---- Avisos (mg-alert-fixed) ---- */
  .storage-warning{background:var(--panel);border:1px solid var(--red);border-radius:var(--radius-md);padding:16px;margin:16px;text-align:center;}
  .storage-warning strong{display:block;color:var(--red);font-size:14.5px;margin-bottom:6px;}
  .storage-warning p{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}

  .alert-banner{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--amber);border-radius:var(--radius-md);padding:13px;margin-bottom:14px;cursor:pointer;width:100%;text-align:left;font-family:inherit;}
  .alert-banner .icon{font-size:19px;}
  .alert-banner strong{display:block;font-size:13.5px;color:var(--amber);}
  .alert-banner span{display:block;font-size:11.5px;color:var(--text-dim);margin-top:2px;}

  /* ---- Resumen por unidad ---- */
  .usum-title{font-size:11px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.4px;margin:0 0 10px;}
  .usum-wrap{margin-bottom:18px;}
  .usum-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .usum-card .plate{font-size:14px;font-weight:800;color:var(--text);}
  .usum-card .sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .usum-card .figs{text-align:right;}
  .usum-card .figs b{display:block;font-size:13.5px;color:var(--text);}
  .usum-card .figs small{font-size:10.5px;color:var(--text-dim);}

  /* ---- Panel de kilómetros ---- */
  .km-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;}
  .km-card-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:10px;}
  .km-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  .km-table th{text-align:left;font-size:10px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:0.3px;padding:8px 6px;background:var(--panel-2);border-bottom:1px solid var(--border);}
  .km-table td{font-size:12.5px;color:var(--text);padding:8px 6px;border-bottom:1px solid var(--border-soft);}
  .km-table tr:last-child td{border-bottom:none;}

  /* ---- Documentos ---- */
  .doc-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;border-left:4px solid var(--blue);}
  .doc-card.vencido{border-left-color:var(--red);}
  .doc-card.porvencer{border-left-color:var(--amber);}
  .doc-card.vigente{border-left-color:var(--green);}
  .doc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .doc-top h4{margin:0;font-size:14.5px;color:var(--text);}
  .doc-top .plate-tag{font-size:10px;font-weight:800;background:var(--panel-2);color:var(--text-dim);padding:3px 9px;border-radius:999px;}
  .doc-card p{margin:6px 0 0;font-size:13px;color:var(--text-dim);}
  .badge.vigente{background:var(--green-soft);color:var(--green);}
  .badge.porvencer{background:rgba(245,166,35,0.14);color:var(--amber);}
  .badge.vencido{background:var(--red-soft);color:var(--red);}
  .doc-file-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:700;color:var(--blue);background:transparent;border:1px solid var(--blue);padding:7px 14px;border-radius:999px;cursor:pointer;}
  .file-picker-note{font-size:11.5px;color:var(--text-dim);margin-top:6px;}

  /* ---- Visor de fotos / documentos ---- */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:var(--radius-sm);}
  .lightbox-close{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:18px;font-weight:800;cursor:pointer;z-index:101;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="eyebrow">Mi Gusto · Logística</div>
    <h1>Gestión Camión</h1>
  </div>
  <div class="nav" id="nav">
    <button data-tab="home" class="active">Inicio</button>
    <button data-tab="historial">Historial</button>
    <button data-tab="documentos">Documentos</button>
  </div>
  <div class="content" id="content">
    <div class="loading">Cargando...</div>
  </div>
  <div class="disclosure" id="disclosureZone"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const content = document.getElementById('content');
const toastEl = document.getElementById('toast');
const nav = document.getElementById('nav');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2400);
}

function fmtDate(iso){
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm} ${hh}:${mi}`;
}

// ==========================================================================
// CAPA DE GUARDADO (DB) — funciona en 3 modos, en este orden de preferencia:
//   1) Adentro de Claude: usa window.storage (como hasta ahora).
//   2) Firebase configurado: usa Firestore (compartido entre todos, en la nube).
//   3) Nada configurado: usa localStorage (funciona, pero SOLO en este navegador,
//      no se comparte entre choferes/dispositivos).
// Todo el resto de la app llama a DB.get/DB.set/DB.delete/DB.list y no le
// importa cuál de los tres modos está activo.
// ==========================================================================
const DB = (function(){
  const usingClaudeStorage = typeof window.storage !== 'undefined' && window.storage !== null;
  let firebaseApp = null;
  let firestoreDb = null;
  let firebaseTriedInit = false;

  function getFirebaseConfig(){
    try{
      const raw = localStorage.getItem('mg_firebase_config');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function saveFirebaseConfig(cfg){
    localStorage.setItem('mg_firebase_config', JSON.stringify(cfg));
    firebaseTriedInit = false;
    firestoreDb = null;
  }

  function clearFirebaseConfig(){
    localStorage.removeItem('mg_firebase_config');
    firebaseTriedInit = false;
    firestoreDb = null;
  }

  async function initFirebase(){
    if(firestoreDb) return true;
    if(firebaseTriedInit) return false;
    firebaseTriedInit = true;
    const cfg = getFirebaseConfig();
    if(!cfg || typeof firebase === 'undefined') return false;
    try{
      firebaseApp = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
      firestoreDb = firebase.firestore();
      return true;
    }catch(e){
      console.error('No se pudo inicializar Firebase', e);
      firestoreDb = null;
      return false;
    }
  }

  const COLLECTION = 'gestion_camion';
  function localKey(key){ return 'mg_local_' + key; }

  async function get(key, shared){
    if(usingClaudeStorage) return window.storage.get(key, shared);
    if(await initFirebase()){
      const doc = await firestoreDb.collection(COLLECTION).doc(key).get();
      if(!doc.exists) throw new Error('not found');
      return { key, value: doc.data().value, shared };
    }
    const v = localStorage.getItem(localKey(key));
    if(v === null) throw new Error('not found');
    return { key, value: v, shared };
  }

  async function set(key, value, shared){
    if(usingClaudeStorage) return window.storage.set(key, value, shared);
    if(await initFirebase()){
      await firestoreDb.collection(COLLECTION).doc(key).set({ value });
      return { key, value, shared };
    }
    localStorage.setItem(localKey(key), value);
    return { key, value, shared };
  }

  async function del(key, shared){
    if(usingClaudeStorage) return window.storage.delete(key, shared);
    if(await initFirebase()){
      await firestoreDb.collection(COLLECTION).doc(key).delete();
      return { key, deleted: true, shared };
    }
    localStorage.removeItem(localKey(key));
    return { key, deleted: true, shared };
  }

  async function list(prefix, shared){
    if(usingClaudeStorage) return window.storage.list(prefix, shared);
    if(await initFirebase()){
      const snap = await firestoreDb.collection(COLLECTION).get();
      const keys = [];
      snap.forEach(doc => { if(!prefix || doc.id.startsWith(prefix)) keys.push(doc.id); });
      return { keys, prefix, shared };
    }
    const keys = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('mg_local_') === 0){
        const realKey = k.slice('mg_local_'.length);
        if(!prefix || realKey.indexOf(prefix) === 0) keys.push(realKey);
      }
    }
    return { keys, prefix, shared };
  }

  function modoActual(){
    if(usingClaudeStorage) return 'claude';
    if(getFirebaseConfig()) return 'firebase';
    return 'local';
  }

  return {
    get, set, delete: del, list,
    usingClaudeStorage, modoActual,
    getFirebaseConfig, saveFirebaseConfig, clearFirebaseConfig, initFirebase
  };
})();

async function getUnidades(){

async function getListaCompartida(key){

}

  if(!list.some(x => x.toLowerCase() === v.toLowerCase())){
    list.push(v);

// ---------- Fotos ----------
function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setupPhotoPicker(btnId, inputId, previewId, maxPhotos){
  maxPhotos = maxPhotos || 2;
  const photos = [];
  const fileInput = document.getElementById(inputId);
  const preview = document.getElementById(previewId);

  fileInput.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []).slice(0, maxPhotos - photos.length);
    for(const file of files){
      try{
        const dataUrl = await resizeImage(file);
        photos.push(dataUrl);
      }catch(err){ /* ignore broken file */ }
    }
    renderPreview();
    fileInput.value = '';
  });

  function renderPreview(){
    preview.innerHTML = photos.map((p,i)=>
      `<div class="photo-thumb"><img src="${p}"><button type="button" data-i="${i}">×</button></div>`
    ).join('');
    preview.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{ photos.splice(+btn.dataset.i, 1); renderPreview(); };
    });
  }

  return { getPhotos: ()=>photos };
}

async function loadEntries(){
  try{

    if(!listRes || !listRes.keys) return [];
    const entries = [];

        if(r && r.value){

          parsed._key = k;
          entries.push(parsed);
        }

    entries.sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
    return entries;

  }
}

// ---------- Documentos y habilitaciones ----------

function docStatus(vencimientoStr){
  if(!vencimientoStr) return { label: 'Sin fecha', cls: '' };
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const venc = new Date(vencimientoStr + 'T00:00:00');
  const dias = Math.round((venc - hoy) / (1000*60*60*24));
  if(dias < 0) return { label: 'Vencido', cls: 'vencido', dias };
  if(dias <= 30) return { label: `Vence en ${dias} día${dias===1?'':'s'}`, cls: 'porvencer', dias };
  return { label: 'Vigente', cls: 'vigente', dias };
}

function fmtFecha(iso){
  const d = new Date(iso + 'T00:00:00');
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}

async function saveDocumento(doc){
  const id = 'documento:' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  doc.fecha = new Date().toISOString();
  if(doc.patente) await addUnidadIfNew(doc.patente);
  try{
    const res = await DB.set(id, JSON.stringify(doc), true);
    return !!res;
  }catch(e){ console.error(e); return false; }
}

async function loadDocumentos(){
  try{
    const listRes = await DB.list('documento:', true);
    if(!listRes || !listRes.keys) return [];
    const docs = [];
    for(const k of listRes.keys){
      try{
        const r = await DB.get(k, true);
        if(r && r.value){
          const parsed = JSON.parse(r.value);
          parsed._key = k;
          docs.push(parsed);
        }
      }catch(e){ /* skip */ }
    }
    return docs;
  }catch(e){ console.error(e); return []; }
}

// De cada combinación patente + tipo de documento, nos quedamos con el más reciente
// (así al cargar la renovación, esa pasa a ser la vigente y no queda desordenado).
function docsVigentesPorTipo(docs){
  const map = {};
  docs.forEach(d=>{
    const tipoFinal = d.tipo || 'Documento';
    const key = (d.patente || '—') + '|' + tipoFinal.toLowerCase();
    if(!map[key] || new Date(d.fecha) > new Date(map[key].fecha)){
      map[key] = Object.assign({}, d, { tipoFinal });
    }
  });
  return Object.values(map).sort((a,b)=>{
    const da = a.vencimiento ? new Date(a.vencimiento) : new Date('2999-01-01');
    const db = b.vencimiento ? new Date(b.vencimiento) : new Date('2999-01-01');
    return da - db;
  });
}

function readFileAsDataUrl(file, maxSizeBytes){
  return new Promise((resolve, reject)=>{
    if(file.type.startsWith('image/')){
      resizeImage(file).then(resolve).catch(reject);
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      if(e.target.result.length > maxSizeBytes){
        reject(new Error('archivo demasiado pesado'));
        return;
      }
      resolve(e.target.result);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function openFileData(dataUrl){
  const isPdf = dataUrl.startsWith('data:application/pdf');
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = (isPdf
    ? `<embed src="${dataUrl}" style="width:100%;height:90vh;border-radius:8px;background:#fff;">`
    : `<img src="${dataUrl}">`) + `<button class="lightbox-close" id="lbClose">×</button>`;
  lb.onclick = (e)=>{ if(e.target === lb) lb.remove(); };
  document.body.appendChild(lb);
  document.getElementById('lbClose').onclick = ()=> lb.remove();
}

// ---------- Resumen simple de km y combustible ----------
function computeUnidadSummary(entries){
  const porUnidad = {};
  const now = new Date();
  const hoyStr = now.toDateString();
  entries.forEach(e=>{
    if(!e.camion) return;
    if(!porUnidad[e.camion]) porUnidad[e.camion] = { ultimoKm: null, fechaKm: null, litrosMes: 0, costoMes: 0, kmSalidaHoy: null, kmVueltaHoy: null };
    const u = porUnidad[e.camion];
    if(e.km){
      if(!u.fechaKm || new Date(e.fecha) > new Date(u.fechaKm)){
        u.ultimoKm = e.km;
        u.fechaKm = e.fecha;
      }
    }
    const fe = new Date(e.fecha);
    if(fe.getMonth() === now.getMonth() && fe.getFullYear() === now.getFullYear()){
      const litros = parseFloat(e.litrosCargados);
      if(!isNaN(litros)) u.litrosMes += litros;
      const costo = parseFloat(e.costoCombustible);
      if(!isNaN(costo)) u.costoMes += costo;
    }
    if(fe.toDateString() === hoyStr && e.km){
      const km = parseFloat(e.km);
      if(!isNaN(km)){
        if(e.tipo === 'salida' && (u.kmSalidaHoy === null || km < u.kmSalidaHoy)) u.kmSalidaHoy = km;
        if(e.tipo === 'vuelta' && (u.kmVueltaHoy === null || km > u.kmVueltaHoy)) u.kmVueltaHoy = km;
      }
    }
  });
  return Object.entries(porUnidad).map(([patente, v])=>{
    const kmHoy = (v.kmSalidaHoy !== null && v.kmVueltaHoy !== null && v.kmVueltaHoy >= v.kmSalidaHoy)
      ? v.kmVueltaHoy - v.kmSalidaHoy : null;
    return { patente, ...v, kmHoy };
  });
}

function renderUnidadSummary(entries){
  const resumen = computeUnidadSummary(entries);
  if(resumen.length === 0) return '';
  return `
    <div class="usum-wrap">
      <div class="usum-title">Resumen por unidad</div>
      ${resumen.map(u=>`
        <div class="usum-card">
          <div>
            <div class="plate">${u.patente}</div>
            <div class="sub">${u.fechaKm ? 'Último km · ' + fmtDate(u.fechaKm) : 'Sin registros de km'}</div>
            <div class="sub">${u.kmHoy !== null ? u.kmHoy + ' km hechos hoy' : 'Todavía sin cerrar el día (falta la vuelta)'}</div>
          </div>
          <div class="figs">
            <b>${u.ultimoKm || '—'} km</b>
            <small>${u.litrosMes > 0 ? u.litrosMes.toFixed(0) + ' L este mes' : 'Sin carga este mes'}</small>
            <small>${u.costoMes > 0 ? '$' + u.costoMes.toFixed(0) + ' gastados' : ''}</small>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

  let modo = null;
  let modoForzado = null;
  let photoPicker = null;
  let checking = false;

  async function actualizarModo(){
    if(checking) return;
    checking = true;
    const patente = normPatente(document.getElementById('f_camion').value);
    const body = document.getElementById('jornadaBody');
    const overrideZone = document.getElementById('modoOverride');
    if(!patente){
      body.innerHTML = `<div class="hint">Escribí la patente para continuar...</div>`;
      overrideZone.style.display = 'none';
      modo = null;
      checking = false;
      return;
    }
    if(modoForzado){
      modo = modoForzado;
      renderCuerpo();
      checking = false;
      return;
    }
    const entries = await loadEntries();
    const hoy = new Date().toDateString();
    const deHoy = entries
      .filter(e => e.camion === patente && (e.tipo === 'salida' || e.tipo === 'vuelta') && new Date(e.fecha).toDateString() === hoy)

    const ultimo = deHoy[deHoy.length - 1];

// ---------- HISTORIAL ----------
function categoriasDeEntry(e){
  const cats = [];
  if(e.tipo === 'salida' || e.tipo === 'vuelta') cats.push('combustible');
  if(e.tipo === 'vuelta' && e.descripcion) cats.push('novedades');
  if(e.tipo === 'falla' || e.urgencia) cats.push('fallas');
  if(e.tipo === 'lavado') cats.push('lavados');
  if(e.tipo === 'ticket') cats.push('tickets');
  return cats;
}

function tipoLabelGlobal(t){
  return {salida:'Inicio de jornada', vuelta:'Cierre de jornada', falla:'Falla reportada', lavado:'Pedido de lavado', ticket:'Ticket / remito'}[t] || t;
}

function csvEscape(v){
  if(v === null || v === undefined) return '';
  const s = String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function computeInformePeriodo(entries, fechaInicio, fechaFin, filterCamion){
  const enPeriodo = entries.filter(e=>{
    const d = new Date(e.fecha);
    return d >= fechaInicio && d <= fechaFin && (filterCamion === 'todos' || e.camion === filterCamion);
  });

  const patentes = [...new Set(enPeriodo.map(e=>e.camion).filter(Boolean))];
  let kmTotal = 0, litrosTotal = 0, gastoCombustible = 0;
  patentes.forEach(p=>{
    const porDia = computeKmPorDia(enPeriodo, p);
    Object.values(porDia).forEach(reg=>{
      if(reg.kmSalida !== null && reg.kmVuelta !== null && reg.kmVuelta >= reg.kmSalida){
        kmTotal += (reg.kmVuelta - reg.kmSalida);
      }
      litrosTotal += reg.litros;
      gastoCombustible += reg.costo;
    });
  });
  const rendimientoProm = litrosTotal > 0 ? (kmTotal / litrosTotal) : null;

  const tickets = enPeriodo.filter(e => e.tipo === 'ticket');

  const fallas = enPeriodo.filter(e => e.tipo === 'falla' || (e.tipo === 'salida' && e.urgencia));
  const fallasResueltas = fallas.filter(e => e.estado === 'resuelta').length;
  const lavados = enPeriodo.filter(e => e.tipo === 'lavado').length;

  const filas = enPeriodo.slice().sort((a,b)=> new Date(a.fecha) - new Date(b.fecha)).map(e=>({
    fecha: fmtDate(e.fecha),
    patente: e.camion || '',
    chofer: e.chofer || '',
    tipo: tipoLabelGlobal(e.tipo),
    km: e.km || '',
    litros: (e.litrosCargados && e.litrosCargados !== '0') ? e.litrosCargados : '',
    costoCombustible: (e.costoCombustible && e.costoCombustible !== '0') ? e.costoCombustible : '',
    proveedor: e.proveedor || e.proveedorAsignado || '',
    descripcion: e.descripcion || '',
    estado: ['abierta','asignada','resuelta'].includes(e.estado) ? estadoLabel(e.tipo, e.estado) : ''
  }));

  return { kmTotal, litrosTotal, rendimientoProm, gastoCombustible, fallasCount: fallas.length, fallasResueltas, lavadosCount: lavados, ticketsCount: tickets.length, filas };
}

function lunesDeSemana(fecha){
  const d = new Date(fecha);
  d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=domingo
  const diff = (dow === 0 ? -6 : 1 - dow);
  d.setDate(d.getDate() + diff);
  return d;
}

function computeDiasPeriodo(entries, fechaInicio, fechaFin, filterCamion){
  const enPeriodo = entries.filter(e=>{
    const d = new Date(e.fecha);
    return d >= fechaInicio && d <= fechaFin;
  });
  const patentes = filterCamion === 'todos'
    ? [...new Set(enPeriodo.map(e=>e.camion).filter(Boolean))]
    : [filterCamion];

  const filas = [];
  patentes.forEach(p=>{
    const porDia = computeKmPorDia(enPeriodo, p);
    let cursor = new Date(fechaInicio);
    cursor.setHours(0,0,0,0);
    const fin = new Date(fechaFin);
    while(cursor <= fin){
      const reg = porDia[cursor.toDateString()];
      const km = (reg && reg.kmSalida !== null && reg.kmVuelta !== null && reg.kmVuelta >= reg.kmSalida) ? reg.kmVuelta - reg.kmSalida : null;
      const salio = !!(reg && (reg.kmSalida !== null || reg.kmVuelta !== null));
      const litros = reg ? reg.litros : 0;
      const costo = reg ? reg.costo : 0;
      filas.push({
        fecha: fmtFechaCorta(cursor),
        patente: p,
        salio: salio ? 'Sí' : 'No',
        km: km !== null ? km : '',
        litros: litros > 0 ? Number(litros.toFixed(0)) : '',
        costo: costo > 0 ? Number(costo.toFixed(0)) : '',
        rendimiento: (km && litros > 0) ? Number((km / litros).toFixed(1)) : ''
      });
      cursor.setDate(cursor.getDate() + 1);
    }
  });
  return filas;
}

function generarExcelInforme(periodoLabel, patente, resumen, diasFilas){
  const wb = XLSX.utils.book_new();

  const resumenAOA = [
    ['INFORME DE GESTIÓN CAMIÓN'],
    [],
    ['Período', periodoLabel],
    ['Unidad', patente === 'todos' ? 'Todas' : patente],
    [],
    ['Concepto', 'Valor'],
    ['Kilómetros recorridos', resumen.kmTotal],
    ['Litros cargados', Number(resumen.litrosTotal.toFixed(0))],
    ['Rendimiento promedio (km/L)', resumen.rendimientoProm !== null ? Number(resumen.rendimientoProm.toFixed(1)) : '—'],
    ['Gasto en combustible ($)', Number(resumen.gastoCombustible.toFixed(0))],
    ['Fallas reportadas', resumen.fallasCount],
    ['Fallas resueltas', resumen.fallasResueltas],
    ['Lavados', resumen.lavadosCount],
  ];
  const wsResumen = XLSX.utils.aoa_to_sheet(resumenAOA);
  wsResumen['!cols'] = [{ wch: 32 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');

  const diasAOA = [['Fecha','Patente','¿Salió?','Km recorridos','Litros cargados','Costo combustible ($)','Rendimiento (km/L)']];
  diasFilas.forEach(f=> diasAOA.push([f.fecha, f.patente, f.salio, f.km, f.litros, f.costo, f.rendimiento]));
  const wsDias = XLSX.utils.aoa_to_sheet(diasAOA);
  wsDias['!cols'] = [{ wch: 10 }, { wch: 12 }, { wch: 9 }, { wch: 15 }, { wch: 16 }, { wch: 20 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, wsDias, 'Combustible y Km');

  const opAOA = [['Fecha','Patente','Chofer','Tipo','Descripción','Proveedor / lavadero','Estado']];
  resumen.filas
    .filter(f => f.tipo === 'Falla reportada' || f.tipo === 'Pedido de lavado')
    .forEach(f=> opAOA.push([f.fecha, f.patente, f.chofer, f.tipo, f.descripcion, f.proveedor, f.estado]));
  const wsOp = XLSX.utils.aoa_to_sheet(opAOA);
  wsOp['!cols'] = [{ wch: 10 }, { wch: 12 }, { wch: 15 }, { wch: 17 }, { wch: 34 }, { wch: 22 }, { wch: 15 }];
  XLSX.utils.book_append_sheet(wb, wsOp, 'Fallas y Lavados');

  return wb;
}

function generarCSVInforme(periodoLabel, patente, resumen, diasFilas){
  const lines = [];
  lines.push(['INFORME DE GESTIÓN CAMIÓN'].map(csvEscape).join(','));
  lines.push(['Período', periodoLabel].map(csvEscape).join(','));
  lines.push(['Unidad', patente === 'todos' ? 'Todas' : patente].map(csvEscape).join(','));
  lines.push([]);
  lines.push(['Resumen'].map(csvEscape).join(','));
  lines.push(['Kilómetros recorridos', resumen.kmTotal].map(csvEscape).join(','));
  lines.push(['Litros cargados', resumen.litrosTotal.toFixed(0)].map(csvEscape).join(','));
  lines.push(['Rendimiento promedio (km/L)', resumen.rendimientoProm !== null ? resumen.rendimientoProm.toFixed(1) : '—'].map(csvEscape).join(','));
  lines.push(['Gasto en combustible ($)', resumen.gastoCombustible.toFixed(0)].map(csvEscape).join(','));
  lines.push(['Fallas reportadas', resumen.fallasCount].map(csvEscape).join(','));
  lines.push(['Fallas resueltas', resumen.fallasResueltas].map(csvEscape).join(','));
  lines.push(['Lavados', resumen.lavadosCount].map(csvEscape).join(','));
  lines.push([]);
  lines.push(['Combustible y km por día (incluye días sin salida)'].map(csvEscape).join(','));
  lines.push(['Fecha','Patente','¿Salió?','Km recorridos','Litros cargados','Costo combustible','Rendimiento'].map(csvEscape).join(','));
  diasFilas.forEach(f=>{
    lines.push([f.fecha, f.patente, f.salio, f.km, f.litros, f.costo, f.rendimiento].map(csvEscape).join(','));
  });
  lines.push([]);
  lines.push(['Fallas y lavados del período'].map(csvEscape).join(','));
  lines.push(['Fecha','Patente','Chofer','Tipo','Descripción','Proveedor / lavadero','Estado'].map(csvEscape).join(','));
  resumen.filas
    .filter(f => f.tipo === 'Falla reportada' || f.tipo === 'Pedido de lavado')
    .forEach(f=> lines.push([f.fecha, f.patente, f.chofer, f.tipo, f.descripcion, f.proveedor, f.estado].map(csvEscape).join(',')));
  return lines.join('\n');
}

function descargarCSV(nombre, contenido){
  const blob = new Blob(['\ufeff' + contenido], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function estadoLabel(tipo, estado){
  if(tipo === 'lavado'){
    return estado === 'abierta' ? 'Pendiente' : estado === 'asignada' ? 'Turno asignado' : 'Realizado';
  }
  return estado === 'abierta' ? 'Sin resolver' : estado === 'asignada' ? 'Asignada' : 'Resuelta';
}

function renderTimeline(historial){
  if(!historial || historial.length === 0) return '';
  const ordenado = historial.slice().sort((a,b)=> new Date(a.fecha) - new Date(b.fecha));
  return `
    <div class="timeline">
      <div class="timeline-title">Historial de actualizaciones</div>
      ${ordenado.map(h=>{
        let cls = '';
        if(/resuelt|realizado/i.test(h.texto)) cls = 'tl-resuelta';
        else if(/sin resolver|pendiente/i.test(h.texto)) cls = 'tl-abierta';
        return `
          <div class="timeline-item ${cls}">
            <div class="tl-date">${fmtDate(h.fecha)}</div>
            <div class="tl-text">${h.texto}</div>
          </div>

  `;
}

    }
    if(e.turnoFecha){

function ultimosNDias(n){
  const arr = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    d.setHours(0,0,0,0);
    arr.push(d);
  }
  return arr;
}

function fmtFechaCorta(d){
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

function diaAbrev(d){
  return ['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()];
}

function computeKmPorDia(entries, patente){
  const map = {};
  entries.filter(e=>e.camion === patente).forEach(e=>{
    if(!e.fecha) return;
    const d = new Date(e.fecha); d.setHours(0,0,0,0);
    const key = d.toDateString();
    if(!map[key]) map[key] = { kmSalida: null, kmVuelta: null, litros: 0, costo: 0 };
    if(e.km){
      const km = parseFloat(e.km);
      if(!isNaN(km)){
        if(e.tipo === 'salida' && (map[key].kmSalida === null || km < map[key].kmSalida)) map[key].kmSalida = km;
        if(e.tipo === 'vuelta' && (map[key].kmVuelta === null || km > map[key].kmVuelta)) map[key].kmVuelta = km;
      }
    }
    const litros = parseFloat(e.litrosCargados);
    if(!isNaN(litros)) map[key].litros += litros;
    const costo = parseFloat(e.costoCombustible);
    if(!isNaN(costo)) map[key].costo += costo;
  });
  return map;
}

function renderBarChartSVG(series, opts){
  opts = opts || {};
  const getValue = opts.getValue || (s => s.km);
  const formatValue = opts.formatValue || (v => v);
  const w = 320, h = 108, barAreaH = 56, barW = 28;
  const gap = (w - barW * series.length) / (series.length + 1);
  const values = series.map(s => getValue(s));
  const max = Math.max(0.0001, ...values.map(v => v || 0));
  let bars = '';
  series.forEach((s, i)=>{
    const v = getValue(s);
    const x = gap + i * (barW + gap);
    const bh = v ? Math.max(4, (v / max) * barAreaH) : 3;
    const y = 18 + (barAreaH - bh);
    const isToday = i === series.length - 1;
    const barColor = isToday ? 'var(--green)' : 'var(--blue)';
    const labelColor = isToday ? 'var(--green)' : 'var(--text-dim)';
    bars += `
      <text x="${x + barW/2}" y="12" font-size="10.5" text-anchor="middle" style="fill:${labelColor};font-weight:${isToday?'800':'600'};font-family:inherit;">${v ? formatValue(v) : '–'}</text>
      <rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="5" style="fill:${barColor};opacity:${v ? 1 : 0.25};"></rect>
      <text x="${x + barW/2}" y="${18 + barAreaH + 13}" font-size="9.5" text-anchor="middle" style="fill:var(--text-dim);font-family:inherit;">${diaAbrev(s.d)} ${fmtFechaCorta(s.d)}</text>
    `;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${bars}</svg>`;
}

function renderKmChartSVG(series){
  return renderBarChartSVG(series, { getValue: s => s.km, formatValue: v => v });
}

function renderRendimientoChartSVG(series){
  return renderBarChartSVG(series, { getValue: s => s.rendimiento, formatValue: v => v.toFixed(1) });
}

function renderKmPanel(entriesFiltradas, filterCamion){
  const patentes = filterCamion && filterCamion !== 'todos'
    ? [filterCamion]
    : [...new Set(entriesFiltradas.map(e=>e.camion).filter(Boolean))];

  if(patentes.length === 0) return `<div class="empty">Todavía no hay registros de kilómetros.</div>`;

  return patentes.map(p=>{
    const dias = ultimosNDias(7);
    const porDia = computeKmPorDia(entriesFiltradas, p);
    const series = dias.map(d=>{
      const reg = porDia[d.toDateString()];
      const km = (reg && reg.kmSalida !== null && reg.kmVuelta !== null && reg.kmVuelta >= reg.kmSalida)
        ? reg.kmVuelta - reg.kmSalida : null;
      const litros = reg ? reg.litros : 0;
      const costo = reg ? reg.costo : 0;
      const rendimiento = (km && litros > 0) ? (km / litros) : null;
      return { d, km, litros, costo, rendimiento };
    });
    const chart = renderKmChartSVG(series);
    const hayRendimiento = series.some(s => s.rendimiento !== null);
    const chartRendimiento = hayRendimiento ? renderRendimientoChartSVG(series) : '';
    const filas = series.slice().reverse().map(s=>`
      <tr${s.km === null && s.litros === 0 ? ' style="opacity:0.55;"' : ''}><td>${fmtFechaCorta(s.d)}</td><td>${s.km !== null ? s.km + ' km' : (s.litros === 0 ? 'No salió' : '—')}</td><td>${s.litros > 0 ? s.litros.toFixed(0) + ' L' : '—'}</td><td>${s.costo > 0 ? '$' + s.costo.toFixed(0) : '—'}</td><td>${s.rendimiento !== null ? s.rendimiento.toFixed(1) + ' km/L' : '—'}</td></tr>
    `).join('');
    return `
      <div class="km-card">
        <div class="km-card-title">${p} · últimos 7 días</div>
        ${chart}
        ${filas
          ? `<table class="km-table"><thead><tr><th>Fecha</th><th>Km</th><th>Litros</th><th>Costo</th><th>Rendim.</th></tr></thead><tbody>${filas}</tbody></table>`
          : `<div class="empty" style="padding:14px 0;">Sin datos en los últimos 7 días.</div>`}
      </div>
      ${hayRendimiento ? `
      <div class="km-card">
        <div class="km-card-title">${p} · rendimiento (km por litro)</div>
        ${chartRendimiento}
        <div class="hint" style="margin-top:10px;">Se calcula con los km recorridos ese día dividido los litros cargados ese mismo día. Los días sin carga de combustible no tienen dato.</div>
      </div>` : ''}
    `;
  }).join('');
}

        `;

        const mailLink = document.getElementById('doc_mail_' + key);
        mailLink.href = `mailto:?subject=${encodeURIComponent(doc.asunto)}&body=${encodeURIComponent(doc.cuerpo)}`;

        document.getElementById('doc_copy_' + key).onclick = async ()=>{
          const txt = document.getElementById('doc_cuerpo_' + key).value;
          try{
            await navigator.clipboard.writeText(txt);
            showToast('Documento copiado ✓');
          }catch(e){
            showToast('No se pudo copiar, seleccionalo manualmente');
          }
        };

        document.getElementById('doc_download_' + key).onclick = ()=>{
          const txt = document.getElementById('doc_cuerpo_' + key).value;
          const nombre = `falla_${(entry.camion || 'unidad')}_${key.replace(/[^0-9]/g,'').slice(0,10)}.txt`;
          try{
            descargarCSV(nombre, txt);
            showToast('Descargando documento...');
          }catch(e){
            showToast('No se pudo descargar, copiá el texto de arriba');
          }
        };
      };
    });
  }

  draw('todos', 'todos');
}

function updateDisclosure(){
  const zone = document.getElementById('disclosureZone');
  if(!zone) return;
  const modo = DB.modoActual();
  if(modo === 'claude'){
    zone.innerHTML = `Los registros quedan compartidos: cualquiera que use este enlace puede verlos y cargar los suyos, para que el líder de logística tenga siempre una visión completa de la operación.`;
  }else if(modo === 'firebase'){
    zone.innerHTML = `Guardado compartido activo (Firebase): todos los que usen este link ven los mismos datos. <a href="#" id="linkConfig" style="color:var(--blue);font-weight:700;">Configuración</a>`;
  }else{
    zone.innerHTML = `⚠️ Los datos se guardan solo en este dispositivo — todavía no se comparten entre choferes. <a href="#" id="linkConfig" style="color:var(--blue);font-weight:700;">Activar guardado compartido</a>`;
  }
  const link = document.getElementById('linkConfig');
  if(link) link.onclick = (ev)=>{ ev.preventDefault(); renderConfigFirebase(); };
}

function parseFirebaseConfigInput(text){
  let cleaned = text.trim();
  cleaned = cleaned.replace(/^\s*(const|var|let)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'');
  try{
    const obj = (new Function('return (' + cleaned + ')'))();
    if(obj && typeof obj === 'object' && obj.apiKey && obj.projectId) return obj;
    return null;
  }catch(e){
    return null;
  }
}

function renderConfigFirebase(){
  const cfgActual = DB.getFirebaseConfig();
  content.innerHTML = `
    <button class="back-link" id="back">← Volver</button>
    <div class="section-title">Guardado compartido (Firebase)</div>
    <p style="font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:14px;">
      Para que todos los que usen este link vean los mismos datos cuando la app esté
      fuera de Claude (por ejemplo en Netlify), hace falta conectarla a una base de
      datos gratuita. Firebase es la opción más simple, no pide tarjeta:
    </p>
    <ol style="font-size:12.5px;color:var(--text-dim);line-height:1.9;padding-left:18px;margin-bottom:16px;">
      <li>Entrá a <strong style="color:var(--text);">console.firebase.google.com</strong> y creá un proyecto nuevo (gratis).</li>
      <li>Adentro del proyecto: <strong style="color:var(--text);">Compilación → Firestore Database → Crear base de datos</strong> (elegí cualquier ubicación, modo "producción" está bien).</li>
      <li>En <strong style="color:var(--text);">Firestore → Reglas</strong>, pegá esto y publicá (permite que la app lea y escriba sin pedir login):
        <pre style="background:var(--panel-2);border-radius:8px;padding:10px;margin-top:6px;font-size:10.5px;overflow-x:auto;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if true;
    }
  }
}</pre>
      </li>
      <li>Volvé a la página principal del proyecto (ícono ⚙ → Configuración del proyecto → Tus apps → agregá una app Web).</li>
      <li>Firebase te va a mostrar un bloque de código con <strong style="color:var(--text);">const firebaseConfig = {...}</strong>. Copiá ese objeto completo y pegalo acá abajo.</li>
    </ol>

    <label>Configuración de Firebase</label>
    <textarea id="cfg_input" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", ... }' style="min-height:130px;font-family:monospace;font-size:11.5px;">${cfgActual ? JSON.stringify(cfgActual, null, 2) : ''}</textarea>
    <div id="cfg_status" class="hint"></div>

    <button class="submit-btn" id="cfg_save">Guardar y activar</button>
    ${cfgActual ? `<button class="submit-btn secondary" id="cfg_clear">Quitar configuración (volver a guardado solo en este dispositivo)</button>` : ''}
  `;
  document.getElementById('back').onclick = renderHome;

  document.getElementById('cfg_save').onclick = ()=>{
    const raw = document.getElementById('cfg_input').value;
    const parsed = parseFirebaseConfigInput(raw);
    const status = document.getElementById('cfg_status');
    if(!parsed){
      status.textContent = 'No pude leer esa configuración. Revisá que sea el objeto completo, tal cual te lo dio Firebase.';
      status.style.color = 'var(--red)';
      return;
    }
    DB.saveFirebaseConfig(parsed);
    status.textContent = 'Guardado. Los próximos guardados van a usar Firebase.';
    status.style.color = 'var(--green)';
    showToast('Firebase configurado ✓');
    setTimeout(()=>{ renderHome(); }, 900);
  };

  const clearBtn = document.getElementById('cfg_clear');
  if(clearBtn){
    clearBtn.onclick = ()=>{
      DB.clearFirebaseConfig();
      showToast('Configuración de Firebase quitada');
      renderHome();
    };
  }
}

// ---------- NAV ----------
nav.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(btn.dataset.tab === 'home') renderHome();
  else if(btn.dataset.tab === 'historial') renderHistorial();
  else renderDocumentos();
});

updateDisclosure();
renderHome();
</script>
</body>
</html>
